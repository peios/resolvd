# resolvd — the Peios stub resolver.
#
# Runtime library dependencies (libpeios, glibc) are derived from the
# binary's DT_NEEDED entries.

[package]
description = "Peios stub resolver - DNS client behind every door to name resolution"

[files]
":usr/sbin/resolvd" = "usr/sbin/resolvd"
# The constant resolv.conf, bottom layer of the /etc merge. Points direct-DNS resolvers at the stub door;
# never regenerated, never carries a server list.
":usr/etc/resolv.conf" = "usr/etc/resolv.conf"
# The service definition and the port-53 reservation. Both inert until an
# image names them in [registry] autoapply; separately, because a
# reservation is a kernel policy statement an image may want to own itself.
":usr/share/regim/resolvd-service.reg" = "usr/share/regim/resolvd-service.reg"
":usr/share/regim/resolvd-port.reg" = "usr/share/regim/resolvd-port.reg"
":usr/share/regman/resolvd.regman" = "usr/share/regman/resolvd.regman"
