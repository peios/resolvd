# libnss_peios_net.so.2 — how a POSIX program resolves a host.
#
# Loaded into every process that calls getaddrinfo, which is why it is its
# own package rather than part of resolvd's. **This is not an opt-in.**
# Peios' glibc is patched so the hosts database is not configurable and
# reaches this module and nothing else (pkgs/glibc/patches/nss): there is no
# nsswitch.conf line, no `files` behind it, and no /etc/hosts.
#
# An image that installs the patched glibc and not this package resolves no
# host at all. The packaging says so nowhere, for the same reason nss-peios
# gives: what this needs at runtime is *a* resolver on
# /run/resolvd/resolv.sock, and a Requires: on resolvd would assert that it
# must be that one.

[package]
description = "Peios NSS module - resolves hosts through resolvd"

[files]
":usr/lib/x86_64-linux-peios/libnss_peios_net.so.2" = "usr/lib/x86_64-linux-peios/libnss_peios_net.so.2"
