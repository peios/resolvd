# Loaded into every POSIX process that resolves a host. Keeping this minimal
# client shim separate from the daemon makes its process-wide attack surface
# explicit and independently deployable.
[package]
name        = "dev.peios.resolvd-nss"
description = "Peios NSS host-resolution client module"
# The Rust crate closure plus the statically linked GCC unwinder; checked
# by build.main against the collected crate expression and runtime licence.
license     = "(Apache-2.0 OR MIT) AND MIT AND (GPL-3.0-or-later WITH GCC-exception-3.1)"



[files]
"@source:LICENSE"                                               = "usr/share/licenses/dev.peios.resolvd-nss/LICENSE"
":usr/lib/x86_64-linux-peios/libnss_peios_net.so.2"             = "usr/lib/x86_64-linux-peios/libnss_peios_net.so.2"
":licenses/nss/**"                                              = "usr/share/licenses/dev.peios.resolvd-nss/third-party"
