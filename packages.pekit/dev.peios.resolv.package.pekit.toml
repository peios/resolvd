# Stateless operator client. It owns no service state and speaks the public
# native resolver protocol, so an alternative conforming resolver can satisfy
# its runtime endpoint without a package-level daemon dependency.
[package]
name        = "dev.peios.resolv"
description = "Peios name-resolution operator client"



[files]
":usr/share/man/man1/resolv.1.gz" = "usr/share/man/man1/resolv.1.gz"
"@source:LICENSE" = "usr/share/licenses/dev.peios.resolv/LICENSE"
":usr/bin/resolv"  = "usr/bin/resolv"
