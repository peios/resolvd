[package]
name        = "dev.peios.resolvd-nss-debuginfo"
description = "Debugging symbols for the Peios NSS host-resolution module"
# The same crate closure and static unwinder as the module; checked by build.main.
license     = "(Apache-2.0 OR MIT) AND MIT AND (GPL-3.0-or-later WITH GCC-exception-3.1)"

[dependencies]
"dev.peios.resolvd-nss" = "= {{release}}"

[files]
"@source:LICENSE"             = "usr/share/licenses/dev.peios.resolvd-nss-debuginfo/LICENSE"
":licenses/nss/**"            = "usr/share/licenses/dev.peios.resolvd-nss-debuginfo/third-party"
":debug/nss/usr/lib/debug/**" = "usr/lib/debug"
