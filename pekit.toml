# resolvd — the Peios stub resolver — resolv, its operator command, and
# libnss_peios_net.so.2, the hosts NSS shim. One cargo workspace, three
# packages; see packages.pekit/.
#
# The libpeios bootstrap mirrors netd's and authd's: pkg-config rather than
# PEIOS_LIB_DIR, and a synthesized peios.pc from the sibling trees when
# libpeios-devel is not installed in the build root. libnetd is a path
# dependency on the sibling netd tree (the subscribe protocol's codec).

out_dir = "out"

[build]
command = """
set -eu
set -o pipefail 2>/dev/null || true

SRC="$(pwd)"
REPO_ROOT="$(cd "$SRC/.." && pwd)"

for tool in cargo rustc gcc pkg-config; do
  command -v "$tool" >/dev/null || { echo "missing required resolvd build tool: $tool" >&2; exit 1; }
done

unset PEIOS_LIB_DIR PEIOS_INCLUDE PKM_UAPI

if ! pkg-config --exists peios; then
  LIBPEIOS_ROOT="$REPO_ROOT/libpeios"
  PKM_UAPI_ROOT="$REPO_ROOT/pkm/out/build/headers/usr/include"
  [ -f "$LIBPEIOS_ROOT/Cargo.toml" ] || { echo "libpeios not found at $LIBPEIOS_ROOT" >&2; exit 1; }
  [ -d "$LIBPEIOS_ROOT/include/peios" ] || { echo "libpeios headers not found" >&2; exit 1; }
  [ -d "$PKM_UAPI_ROOT/pkm" ] || { echo "pkm UAPI headers not found at $PKM_UAPI_ROOT" >&2; exit 1; }
  cargo build --release --locked --manifest-path "$LIBPEIOS_ROOT/Cargo.toml"
  PC_DIR="$PEKIT_OUT/pkgconfig"
  mkdir -p "$PC_DIR"
  LIBPEIOS_VERSION="$(sed -n 's/^version = "\\([^"]*\\)".*/\\1/p' "$LIBPEIOS_ROOT/Cargo.toml" | head -1)"
  {
    printf 'prefix=%s\\n' "$LIBPEIOS_ROOT"
    printf 'exec_prefix=${prefix}\\n'
    printf 'libdir=%s/target/release\\n' "$LIBPEIOS_ROOT"
    printf 'includedir=%s/include\\n' "$LIBPEIOS_ROOT"
    printf '\\n'
    printf 'Name: peios\\n'
    printf 'Description: Peios userspace C ABI library (libpeios)\\n'
    printf 'Version: %s\\n' "$LIBPEIOS_VERSION"
    printf 'Libs: -L${libdir} -lpeios\\n'
    printf 'Cflags: -I${includedir} -I%s\\n' "$PKM_UAPI_ROOT"
  } > "$PC_DIR/peios.pc"
  export PKG_CONFIG_PATH="$PC_DIR${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
fi

export BINDGEN_EXTRA_CLANG_ARGS="-isystem $(gcc -print-file-name=include) ${BINDGEN_EXTRA_CLANG_ARGS:-}"

cargo build --release --locked --bin resolvd --bin resolv --target-dir "$PEKIT_OUT/target"
cargo build --release --locked -p nss_peios_net --target-dir "$PEKIT_OUT/target"

mkdir -p "$PEKIT_OUT/usr/sbin" "$PEKIT_OUT/usr/bin" "$PEKIT_OUT/etc"
install -m 0755 "$PEKIT_OUT/target/release/resolvd" "$PEKIT_OUT/usr/sbin/resolvd"
install -m 0755 "$PEKIT_OUT/target/release/resolv" "$PEKIT_OUT/usr/bin/resolv"

# The constant resolv.conf: a pointer to the answerer, never a copy of the
# answer. Nothing regenerates it.
install -m 0644 "$SRC/etc/resolv.conf" "$PEKIT_OUT/etc/resolv.conf"

# glibc dlopens the module by literal name, libnss_peios_net.so.2, from its
# configured --libdir (the triplet directory); see authd/pekit.toml.
mkdir -p "$PEKIT_OUT/usr/lib/x86_64-linux-peios"
install -m 0644 "$PEKIT_OUT/target/release/libnss_peios_net.so" "$PEKIT_OUT/usr/lib/x86_64-linux-peios/libnss_peios_net.so.2"

# Seeds are offered, not applied: an image opts in with [registry] autoapply.
mkdir -p "$PEKIT_OUT/usr/share/regim" "$PEKIT_OUT/usr/share/regman"
install -m 0644 "$SRC/registry.d/resolvd-service.reg" "$PEKIT_OUT/usr/share/regim/resolvd-service.reg"
install -m 0644 "$SRC/registry.d/resolvd-port.reg" "$PEKIT_OUT/usr/share/regim/resolvd-port.reg"
install -m 0644 "$SRC/resolvd.regman" "$PEKIT_OUT/usr/share/regman/resolvd.regman"
"""

[build.dependencies.peipkg]
cargo = "*"
rust = "*"
gcc = "*"
pkgconf-pkg-config = "*"
libpeios-devel = "*"
kernel-headers = "*"

[test]
command = "cargo test --workspace"

[clean]
command = "cargo clean"
