# resolvd — Peios's machine-wide resolver, its stateless operator client, and
# the NSS shim loaded into POSIX processes. One locked offline Rust build emits
# the three runtime boundaries, per-component symbols, shared debug sources,
# and corresponding source.

out_dir = "out"

[source_package]
name = "dev.peios.resolvd-source"

[build.vendor]
command = '''
set -eu
SRC=$(pwd -P)
export SRC
export CARGO_HOME=/tmp/cargo-resolvd-vendor
export CARGO_NET_GIT_FETCH_WITH_CLI=true
mkdir -p "$CARGO_HOME" "$PEKIT_OUT"

# Populate the fresh build environment from the immutable lock before switching
# the rest of the build offline. This includes public Git dependencies such as
# libnetd; no sibling checkout is mounted into the package build.
cargo fetch --locked

# Cargo does not vendor path dependencies. Refuse sibling state that would be
# absent from the corresponding-source package and mutable across rebuilds.
cargo metadata --locked --offline --format-version 1 |
  python3 -c '
import json, os, pathlib, sys
metadata = json.load(sys.stdin)
root = pathlib.Path(os.environ["SRC"]).resolve()
members = set(metadata["workspace_members"])
external_paths = []
for package in metadata["packages"]:
    if package["id"] in members or package.get("source") is not None:
        continue
    manifest = pathlib.Path(package["manifest_path"]).resolve()
    try:
        manifest.relative_to(root)
    except ValueError:
        external_paths.append(str(manifest))
if external_paths:
    raise SystemExit(
        "resolvd: mutable sibling Cargo dependencies are not publishable:\n  "
        + "\n  ".join(sorted(external_paths))
    )
'

cargo vendor --locked "$PEKIT_OUT/vendor" > "$PEKIT_OUT/cargo-config.toml"
test -s "$PEKIT_OUT/cargo-config.toml"
test -n "$(find "$PEKIT_OUT/vendor" -mindepth 1 -maxdepth 1 -type d -print -quit)"
'''

[build.vendor.dependencies.peipkg]
"dev.peios.build-essentials-rust" = ">= 1.0.0-1"
"org.python.python3"              = "*"

[build.vendor.dependencies.apt]
cargo     = "*"
rustc     = "*"
python3   = "*"
findutils = "*"
git = "*"
ca-certificates = "*"

[build.main]
needs = ["vendor"]
command = '''
set -eu
set -o pipefail 2>/dev/null || true

SRC=$(pwd -P)
DEBUG_PREFIX=/usr/src/debug/dev.peios.resolvd
DEBUG_ROOT=$PEKIT_OUT$DEBUG_PREFIX
export CARGO_HOME=$PEKIT_OUT/cargo-home
mkdir -p "$CARGO_HOME"
cp "$PEKIT_VENDOR_OUT/cargo-config.toml" "$CARGO_HOME/config.toml"

# Peiosutils remains the system command suite. GNU compatibility is confined
# to the build process for conventional install/chmod semantics.
if test -d /usr/libexec/coreutils-build; then
  export PATH=/usr/libexec/coreutils-build:$PATH
fi

for tool in cargo rustc gcc pkg-config python3 objcopy strip readelf debugedit; do
  command -v "$tool" >/dev/null || {
    echo "resolvd: missing required build tool: $tool" >&2
    exit 1
  }
done

unset PEIOS_LIB_DIR PEIOS_INCLUDE PKM_UAPI
test "$(pkg-config --modversion peios)" = 0.5.0 || {
  echo "resolvd: dev.peios.libpeios-devel 0.5.0 is required" >&2
  exit 1
}
export BINDGEN_EXTRA_CLANG_ARGS="-isystem $(gcc -print-file-name=include) ${BINDGEN_EXTRA_CLANG_ARGS:-}"

cargo metadata --locked --offline --no-deps --format-version 1 |
  python3 -c '
import json, os, sys
metadata = json.load(sys.stdin)
members = set(metadata["workspace_members"])
versions = sorted({p["version"] for p in metadata["packages"] if p["id"] in members})
expected = os.environ["PEKIT_VERSION"]
if versions != [expected]:
    raise SystemExit(f"resolvd: workspace versions {versions!r} do not equal package version {expected!r}")
'

export RUSTFLAGS="${RUSTFLAGS:+$RUSTFLAGS }--remap-path-prefix=$PEKIT_WORKSPACE_ROOT=$DEBUG_PREFIX/.workspace --remap-path-prefix=$PEKIT_OUT_BASE=$DEBUG_PREFIX/.build --remap-path-prefix=$SRC=$DEBUG_PREFIX --remap-path-prefix=$PEKIT_VENDOR_OUT/vendor=$DEBUG_PREFIX/vendor"
TARGET=$PEKIT_OUT/target
CARGO_PROFILE_RELEASE_DEBUG=2 CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO=off \
  cargo build --release --locked --offline \
    --bin resolvd --bin resolv --target-dir "$TARGET"
CARGO_PROFILE_RELEASE_DEBUG=2 CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO=off \
  cargo build --release --locked --offline \
    -p nss_peios_net --target-dir "$TARGET"

mkdir -p "$PEKIT_OUT/usr/sbin" "$PEKIT_OUT/usr/bin" \
         "$PEKIT_OUT/usr/etc" "$PEKIT_OUT/usr/lib/x86_64-linux-peios" \
         "$PEKIT_OUT/usr/share/regim" "$PEKIT_OUT/usr/share/regman"
install -m 0755 "$TARGET/release/resolvd" "$PEKIT_OUT/usr/sbin/resolvd"
install -m 0755 "$TARGET/release/resolv" "$PEKIT_OUT/usr/bin/resolv"
install -m 0644 "$TARGET/release/libnss_peios_net.so" \
  "$PEKIT_OUT/usr/lib/x86_64-linux-peios/libnss_peios_net.so.2"
install -m 0644 "$SRC/etc/resolv.conf" "$PEKIT_OUT/usr/etc/resolv.conf"
install -m 0644 "$SRC/registry.d/resolvd-service.reg" \
  "$PEKIT_OUT/usr/share/regim/resolvd-service.reg"
install -m 0644 "$SRC/registry.d/resolvd-port.reg" \
  "$PEKIT_OUT/usr/share/regim/resolvd-port.reg"
install -m 0644 "$SRC/resolvd.regman" \
  "$PEKIT_OUT/usr/share/regman/resolvd.regman"

: > "$PEKIT_OUT/.debug-sources"
split_debug() {
  component=$1
  elf=$2
  list=$PEKIT_OUT/.debug-$component
  debugedit -b "$SRC" -d "$DEBUG_PREFIX" -l "$list" -n "$elf"
  cat "$list" >> "$PEKIT_OUT/.debug-sources"
  build_id=$(readelf -n "$elf" | sed -n 's/^[[:space:]]*Build ID: //p' | head -1)
  test -n "$build_id"
  first=$(printf %s "$build_id" | cut -c1-2)
  rest=$(printf %s "$build_id" | cut -c3-)
  debug=$PEKIT_OUT/debug/$component/usr/lib/debug/.build-id/$first/$rest.debug
  mkdir -p "$(dirname "$debug")"
  objcopy --only-keep-debug "$elf" "$debug"
  strip --strip-unneeded "$elf"
  objcopy --add-gnu-debuglink="$debug" "$elf"
  rm -f "$list"
}

split_debug resolvd "$PEKIT_OUT/usr/sbin/resolvd"
split_debug resolv "$PEKIT_OUT/usr/bin/resolv"
split_debug nss "$PEKIT_OUT/usr/lib/x86_64-linux-peios/libnss_peios_net.so.2"

mkdir -p "$DEBUG_ROOT"
tr '\0' '\n' < "$PEKIT_OUT/.debug-sources" | LC_ALL=C sort -u |
while IFS= read -r source; do
  test -n "$source" || continue
  case "$source" in */) continue ;; esac
  case "$source" in
    "$DEBUG_PREFIX"/vendor/*)
      relative=${source#"$DEBUG_PREFIX"/}
      origin=$PEKIT_VENDOR_OUT/$relative
      ;;
    "$DEBUG_PREFIX"/*)
      relative=${source#"$DEBUG_PREFIX"/}
      origin=$SRC/$relative
      ;;
    vendor/*)
      relative=$source
      origin=$PEKIT_VENDOR_OUT/$source
      ;;
    *)
      relative=$source
      origin=$SRC/$source
      ;;
  esac
  test -f "$origin" || continue
  mkdir -p "$DEBUG_ROOT/$(dirname "$relative")"
  cp "$origin" "$DEBUG_ROOT/$relative"
done
rm -f "$PEKIT_OUT/.debug-sources"
test -n "$(find "$DEBUG_ROOT" -type f -print -quit)"

'''

[build.main.dependencies.peipkg]
"dev.peios.build-essentials-rust" = ">= 1.0.0-1"
"org.pkgconf.pkgconf"             = "*"
"org.llvm.clang-devel"            = ">= 22, < 23"
"org.python.python3"              = "*"
"dev.peios.libpeios-devel"        = "= 0.5.0-1"

[build.main.dependencies.apt]
dash         = "*"
coreutils    = "*"
findutils    = "*"
grep         = "*"
sed          = "*"
cargo        = "*"
rustc        = "*"
gcc          = "*"
binutils     = "*"
debugedit    = "*"
python3      = "*"
libclang-dev = "*"
pkgconf      = "*"

[test]
gate = true
needs = ["main", "vendor"]
command = '''
set -eu
export CARGO_HOME=$PEKIT_OUT/cargo-home
mkdir -p "$CARGO_HOME"
cp "$PEKIT_VENDOR_OUT/cargo-config.toml" "$CARGO_HOME/config.toml"
unset PEIOS_LIB_DIR PEIOS_INCLUDE PKM_UAPI
test "$(pkg-config --modversion peios)" = 0.5.0
export BINDGEN_EXTRA_CLANG_ARGS="-isystem $(gcc -print-file-name=include) ${BINDGEN_EXTRA_CLANG_ARGS:-}"
cargo test --release --workspace --locked --offline --target-dir "$PEKIT_OUT/target"

# Validate the exact staged package output produced by build.main.
SRC=$(pwd -P)
PEKIT_OUT="$PEKIT_MAIN_OUT"
test "$("$PEKIT_OUT/usr/bin/resolv" version)" = "resolv $PEKIT_VERSION"
python3 - "$PEKIT_OUT" <<'PY'
import json, pathlib, sys
root = pathlib.Path(sys.argv[1])
regim = root / "usr/share/regim"
service = json.loads((regim / "resolvd-service.reg").read_text())
port = json.loads((regim / "resolvd-port.reg").read_text())
service_values = {
    value["name"]: value["data"]
    for key in service["keys"]
    if key["path"] == r"Machine\System\Services\resolvd"
    for value in key["values"]
}
assert service_values["ImagePath"] == "/usr/sbin/resolvd"
assert service_values["Identity"] == "LocalService"
assert service_values["Readiness"] == 0
assert service_values["RuntimeDirectories"] == ["resolvd"]
assert service_values["RestartPolicy"] == 2
assert service_values["ErrorControl"] == 0
reservations = {
    value["name"]: value
    for key in port["keys"]
    if key["path"] == r"Machine\System\Network\TcpIp\PortReservations"
    for value in key["values"]
}
assert set(reservations) == {"tcp,udp:53"}
assert reservations["tcp,udp:53"]["type"] == "binary"
assert len(bytes.fromhex(reservations["tcp,udp:53"]["data"])) > 20
effective = [
    line.strip()
    for line in (root / "usr/etc/resolv.conf").read_text().splitlines()
    if line.strip() and not line.lstrip().startswith("#")
]
assert effective == ["nameserver 127.0.0.53", "options edns0"]
regman = (root / "usr/share/regman/resolvd.regman").read_text()
assert r"Machine\System\Network\Dns" in regman
assert "FallbackServers" in regman and "ControlSecurity" in regman
PY

NSS=$PEKIT_OUT/usr/lib/x86_64-linux-peios/libnss_peios_net.so.2
readelf -Ws "$NSS" | grep -q '_nss_peios_net_gethostbyname4_r'
readelf -Ws "$NSS" | grep -q '_nss_peios_net_gethostbyaddr2_r'

for record in \
  "resolvd:$PEKIT_OUT/usr/sbin/resolvd:exe" \
  "resolv:$PEKIT_OUT/usr/bin/resolv:exe" \
  "nss:$NSS:dso"
do
  component=${record%%:*}
  remain=${record#*:}
  elf=${remain%:*}
  kind=${record##*:}
  readelf -h "$elf" | grep -Eq 'Type:[[:space:]]+DYN'
  readelf -lW "$elf" | grep -q 'GNU_RELRO'
  readelf -lW "$elf" | grep -Eq 'GNU_STACK[[:space:]].*RW[[:space:]]'
  readelf -dW "$elf" | grep -q 'BIND_NOW'
  ! readelf -dW "$elf" | grep -Eq '(RPATH|RUNPATH|TEXTREL)'
  ! readelf -SW "$elf" | grep -q '\.debug_info'
  if test "$kind" = exe; then
    readelf -dW "$elf" | grep -Eq 'FLAGS_1.*PIE'
  else
    readelf -dW "$elf" | grep -Fq 'Library soname: [libnss_peios_net.so.2]'
  fi
  build_id=$(readelf -n "$elf" | sed -n 's/^[[:space:]]*Build ID: //p' | head -1)
  test -n "$build_id"
  debug=$PEKIT_OUT/debug/$component/usr/lib/debug/.build-id/$(printf %s "$build_id" | cut -c1-2)/$(printf %s "$build_id" | cut -c3-).debug
  test -s "$debug"
  readelf -SW "$debug" | grep -q '\.debug_info'
  test "$(readelf -n "$debug" | sed -n 's/^[[:space:]]*Build ID: //p' | head -1)" = "$build_id"
  for forbidden in "$SRC" "$PEKIT_VENDOR_OUT" "$PEKIT_OUT_BASE" "$PEKIT_WORKSPACE_ROOT"; do
    ! grep -aF "$forbidden" "$elf" "$debug" >/dev/null
  done
done

readelf -dW "$PEKIT_OUT/usr/sbin/resolvd" | grep -Fq 'Shared library: [libpeios.so.0]'
! readelf -dW "$PEKIT_OUT/usr/bin/resolv" | grep -Fq 'libpeios.so'
! readelf -dW "$NSS" | grep -Fq 'libpeios.so'
'''

[test.dependencies.peipkg]
"dev.peios.build-essentials-rust" = ">= 1.0.0-1"
"org.pkgconf.pkgconf"             = "*"
"org.llvm.clang-devel"            = ">= 22, < 23"
"org.python.python3"              = "*"
"dev.peios.libpeios-devel"        = "= 0.5.0-1"

[test.dependencies.apt]
dash         = "*"
coreutils    = "*"
findutils    = "*"
grep         = "*"
sed          = "*"
cargo        = "*"
rustc        = "*"
gcc          = "*"
binutils     = "*"
debugedit    = "*"
python3      = "*"
libclang-dev = "*"
pkgconf      = "*"

[clean]
command = "cargo clean"
