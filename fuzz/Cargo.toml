[package]
name = "resolvd-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = { version = "0.4", features = ["arbitrary-derive"] }
dns = { path = "../dns" }
resolvd-core = { path = "../resolvd-core" }
netd-core = { git = "https://github.com/peios/netd.git", rev = "91185f8a21307911ac7d23e08877f7afb09ff122" }
resolvd = { path = "../resolvd" }

[[bin]]
name = "dns_decode"
path = "fuzz_targets/dns_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "resolv_wire"
path = "fuzz_targets/resolv_wire.rs"
test = false
doc = false
bench = false

[[bin]]
name = "engine_ops"
path = "fuzz_targets/engine_ops.rs"
test = false
doc = false
bench = false

[[bin]]
name = "stub_query"
path = "fuzz_targets/stub_query.rs"
test = false
doc = false
bench = false

[workspace]
