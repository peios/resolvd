# Peios: this file is constant and points at the resolver, resolvd, which
# listens on 127.0.0.53. It carries no server list and no search list on
# purpose -- both belong to resolvd, which learns them from netd per
# interface and applies them at every door, including this one. Configure
# name resolution in the registry (Machine\System\Network\Resolver and each
# profile's DNS key), not here; this file is not read by anything Peios
# ships and is never regenerated.
nameserver 127.0.0.53
options edns0
