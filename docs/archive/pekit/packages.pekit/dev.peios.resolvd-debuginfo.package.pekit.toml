[package]
name        = "dev.peios.resolvd-debuginfo"
description = "Debugging symbols for the Peios name-resolution service"
# The same crate closure as resolvd; checked by build.main.
license     = "((MIT OR Apache-2.0) AND Unicode-3.0) AND Apache-2.0 AND (Apache-2.0 OR MIT) AND BSD-3-Clause AND ISC AND MIT AND (MIT OR Unlicense)"

[dependencies]
"dev.peios.resolvd" = "= {{release}}"

[files]
"@source:LICENSE"                  = "usr/share/licenses/dev.peios.resolvd-debuginfo/LICENSE"
":licenses/resolvd/**"             = "usr/share/licenses/dev.peios.resolvd-debuginfo/third-party"
":debug/resolvd/usr/lib/debug/**"  = "usr/lib/debug"
