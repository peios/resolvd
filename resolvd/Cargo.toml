[package]
name = "resolvd"
description = "The Peios stub resolver: every door to name resolution runs one engine."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "resolvd"
path = "src/lib.rs"

[[bin]]
name = "resolvd"
path = "src/main.rs"

[dependencies]
dns = { path = "../dns" }
libresolv = { path = "../libresolv" }
# The netd subscribe protocol: DNS scopes arrive on netd's control socket.
# Pin the public release commit so this source tree never depends on a mutable
# sibling checkout.
libnetd = { git = "https://github.com/peios/netd.git", rev = "301fdabdeb5ef67fcaa308b9522f9b24aeef4cf4" }
libc = { workspace = true }
peios = { workspace = true }
